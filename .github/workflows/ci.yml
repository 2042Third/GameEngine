name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            preset: windows-vs2022
          - name: Linux
            os: ubuntu-24.04
            preset: linux
          - name: macOS
            os: macos-14
            preset: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libgtk-3-dev libvulkan-dev pkg-config
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake --preset ${{ matrix.preset }} 2>&1 | tee configure.log

      - name: Build (Release)
        shell: bash
        run: |
          set -o pipefail
          # Ninja (Linux, macOS) keeps building after a failure, so one run reports every compile error.
          keepGoing=()
          if [ "$RUNNER_OS" != "Windows" ]; then keepGoing=(-- -k 0); fi
          cmake --build --preset ${{ matrix.preset }}-release --parallel "${keepGoing[@]}" 2>&1 | tee build.log

      # Hosted runners have no GPU: suites that need one carry the "gpu" label.
      - name: Test (Release)
        shell: bash
        env:
          STRATA_TEST_TRACE: "1" # Tests print each test case as it starts, so a crash names its test
        run: |
          set -o pipefail
          # Linux overcommits memory: a test that runs away with memory or disk would take the whole runner down (the
          # job ends with exit code 143 and no annotations). Limits make such a test fail on its own instead.
          if [ "$RUNNER_OS" = "Linux" ]; then
            ulimit -v 10000000 # KiB of address space per process
            ulimit -f 2097152  # KiB per file
          fi
          status=0
          exclude=()
          if [ "$RUNNER_OS" != "Windows" ]; then
            # Diagnostic while a POSIX-only output flood in StrataTests.Core is tracked down: CTest keeps a test's output in
            # memory, so the core suites run outside it with bounded output (same arguments as the CTest entry).
            python=$(command -v python3 || command -v python)
            (cd "build/${{ matrix.preset }}/bin/Release" && "$python" "$GITHUB_WORKSPACE/.github/scripts/run_limited.py" \
              "$GITHUB_WORKSPACE/core.log" 300000000 ./StrataTests \
              "--test-suite-exclude=GPU*,EndToEnd*,Package*,FeatureTest,Editor.FeatureTest" --no-intro=true) || status=1
            exclude=(-E '^StrataTests\.Core$')
          fi
          ctest --preset ${{ matrix.preset }}-release -LE gpu "${exclude[@]}" --output-on-failure --timeout 900 2>&1 | tee test.log || status=1
          exit $status

      # Job logs need repository admin rights to download; annotations are public, so failures are readable from the
      # checks API and the pull request UI.
      - name: Annotate failures
        if: failure() || cancelled()
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/annotate_failures.py configure.log build.log core.log test.log
