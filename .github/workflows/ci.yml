name: CI

on:
  push:
    # ci/<name> branches run CI before a change lands on main (AGENTS.md, "CI before main").
    branches: [main, 'ci/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            preset: windows-vs2022
          - name: Linux
            os: ubuntu-24.04
            preset: linux
          - name: macOS
            os: macos-14
            preset: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libgtk-3-dev libvulkan-dev pkg-config
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake --preset ${{ matrix.preset }} 2>&1 | tee configure.log

      - name: Build (Release)
        shell: bash
        run: |
          set -o pipefail
          # Ninja (Linux, macOS) keeps building after a failure, so one run reports every compile error.
          keepGoing=()
          if [ "$RUNNER_OS" != "Windows" ]; then keepGoing=(-- -k 0); fi
          cmake --build --preset ${{ matrix.preset }}-release --parallel "${keepGoing[@]}" 2>&1 | tee build.log

      - name: Diagnose a hang (temporary)
        if: runner.os == 'Linux'
        shell: bash
        continue-on-error: true
        run: |
          sudo apt-get install -y gdb > /dev/null 2>&1 || true
          cd build/linux/bin/Release
          ulimit -v 10000000
          ulimit -f 2097152
          export STRATA_TEST_TRACE=1
          run() {
            timeout -k 60 -s INT "$1" gdb -q -batch -ex "set pagination off" -ex "set print frame-arguments none" -ex run -ex "info threads" \
              -ex "thread apply all bt 30" --args ./StrataTests "$2" --no-intro=true > "$3" 2>&1 || true
          }
          run 150 "--test-suite=World.Streaming" diag1.log
          run 840 "--test-suite-exclude=GPU*,EndToEnd*,Package*,Perf.*,PerfGPU.*,FeatureTest,Editor.FeatureTest" diag2.log
          python3 - <<'PY'
          import re
          for number, name in ((1, "diag1.log"), (2, "diag2.log")):
              try:
                  lines = open(name, errors="replace").read().splitlines()
              except OSError:
                  continue
              cases = [l for l in lines if l.startswith("[test case]")]
              kept = cases[-3:] + [l for l in lines if l.startswith(("[doctest] test cases", "Program", "Thread ", "#", "Fatal", "terminate"))]
              kept = [re.sub(r"0x[0-9a-f]{8,16} in ", "", l) for l in kept]
              text = "\n".join(kept)
              pieces = [text[i:i + 3900] for i in range(0, len(text), 3900)][:4]
              for index, piece in enumerate(pieces):
                  escaped = piece.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=Diag %d.%d::%s" % (number, index + 1, escaped))
          PY

      # Hosted runners have no GPU: suites that need one carry the "gpu" label. Perf budgets (label "perf") hold for the
      # reference machine (StrataTests/Perf/Budgets.json); shared runners of other speeds would fail or pass them at
      # random, so the perf gate runs on the reference machine (Docs/DeveloperGuide.md, "Perf tests").
      - name: Test (Release)
        shell: bash
        env:
          STRATA_TEST_TRACE: "1" # Tests print each test case as it starts, so a crash names its test
        run: |
          set -o pipefail
          # Linux overcommits memory: a test that runs away with memory or disk would take the whole runner down (the
          # job ends with exit code 143 and no annotations). Limits make such a test fail on its own instead.
          if [ "$RUNNER_OS" = "Linux" ]; then
            ulimit -v 10000000 # KiB of address space per process
            ulimit -f 2097152  # KiB per file
          fi
          ctest --preset ${{ matrix.preset }}-release -LE "gpu|perf" --output-on-failure --timeout 900 2>&1 | tee test.log

      # Job logs need repository admin rights to download; annotations are public, so failures are readable from the
      # checks API and the pull request UI.
      - name: Annotate failures
        if: failure() || cancelled()
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/annotate_failures.py configure.log build.log test.log

  # Releases ship Dist builds (asserts compiled out, ST_DIST code paths), which only the release workflow built: a change
  # that compiled with asserts on alone broke Dist in wave 3 unnoticed. Every target is built in Dist on Windows here.
  windows-dist:
    name: Windows (Dist build)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake --preset windows-vs2022 2>&1 | tee configure.log

      - name: Build (Dist)
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset windows-vs2022-dist --parallel 2>&1 | tee build.log

      - name: Annotate failures
        if: failure() || cancelled()
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/annotate_failures.py configure.log build.log
